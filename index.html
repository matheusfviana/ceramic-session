<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Ano de Baby e Baby</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-color: #FAF9F6; /* Off-white chic */
            --text-main: #2C2C2C; /* Grafite escuro */
            --text-light: #5A5A5A;
            --accent: #A39171; /* Dourado/Taupe suave */
            --card-bg: #FFFFFF;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Lato', sans-serif;
            font-weight: 300;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Tipografia Elegante */
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            color: var(--text-main);
            text-align: center;
        }

        h1 { 
            font-size: 4.5rem; 
            font-style: italic;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        h2 { 
            font-size: 3rem; 
            margin-bottom: 40px; 
            position: relative;
        }

        h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 1px;
            background-color: var(--accent);
            margin: 20px auto 0;
        }

        p { 
            font-size: 1.6rem; 
            line-height: 1.8; 
            text-align: center; 
            color: var(--text-light);
        }

        /* Menu Superior - Estilo Minimalista para TV */
        nav {
            padding: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            background: transparent;
        }

        .tab-btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid rgba(44, 44, 44, 0.2);
            padding: 15px 35px;
            font-size: 1.3rem;
            font-family: 'Lato', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--text-main);
            color: var(--bg-color);
            border-color: var(--text-main);
            transform: translateY(-2px);
        }

        /* Área de Conteúdo */
        .content-area {
            flex: 1;
            padding: 20px 60px 60px 60px;
            overflow-y: auto;
        }

        .tab-content {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        /* Grid de Fotos e Galeria (Estilo Fine Art) */
        .grid-galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            margin-top: 30px;
        }

        .cartao {
            background: var(--card-bg);
            padding: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.04);
            text-align: center;
            transition: transform 0.5s ease;
        }

        .cartao:hover {
            transform: translateY(-5px);
        }

        .cartao img, .cartao video {
            width: 100%;
            height: 350px;
            object-fit: cover;
            filter: contrast(0.95) saturate(0.9); /* Filtro sutil para elegância */
        }

        .cartao-info {
            padding: 25px 10px 10px 10px;
        }

            font-size: 1.8rem; 
            margin: 0 0 10px 0; 
            font-style: italic
